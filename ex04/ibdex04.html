<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>User Registration</h1>

    <form >
       
        <p>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname"  >
        </p>


        <p>
            <label for="email">Email Address:</label>
            <input type="email" id="email" required>
        </p>


        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" required minlength="8">
        </p>


        <p>
           
            <input type="radio" id="beginner"  required>
            <label for="beginner">Beginner</label><br>

            <input type="radio" id="intermediate">
            <label for="intermediate">Intermediate</label>
        </p>

 
        <p>
            <label for="track">Preferred Learning Track:</label>
            <select id="track" required >
                <option >--Please choose an option--</option>
                <option >Web Development</option>
                <option >System Development</option>
            </select>
        </p>


        <p>
            <label for="bio">Short Bio:</label><br>
            <textarea id="bio"  ></textarea>
        </p>


        <p>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label>
        </p>

     
        <p>
            <button type="submit">Register</button>
        </p>
    </form>
</body>
</html>
