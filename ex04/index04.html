<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>User Registration</h1>

    <form action="#" method="POST">
        <!-- 1. Full Name Input -->
        <p>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required minlength="3">
        </p>

        <!-- 2. Email Input -->
        <p>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <!-- 3. Password Input -->
        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required minlength="8">
        </p>

        <!-- 4. Radio Buttons Group -->
        <p>
            <span>Experience Level:</span><br>
            <input type="radio" id="beginner" name="experience" value="beginner" required>
            <label for="beginner">Beginner</label><br>

            <input type="radio" id="intermediate" name="experience" value="intermediate">
            <label for="intermediate">Intermediate</label>
        </p>

        <!-- 5. Select Dropdown -->
        <p>
            <label for="track">Preferred Learning Track:</label>
            <select id="track" name="track" required>
                <option value="">--Please choose an option--</option>
                <option value="web">Web Development</option>
                <option value="sysdev">System Development</option>
            </select>
        </p>

        <!-- 6. Textarea -->
        <p>
            <label for="bio">Short Bio:</label><br>
            <textarea id="bio" name="bio" rows="4" cols="30" required minlength="10"></textarea>
        </p>

        <!-- 7. Checkbox Agreement -->
        <p>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label>
        </p>

        <!-- 8. Submit Button -->
        <p>
            <button type="submit">Register</button>
        </p>
    </form>
</body>
</html>
