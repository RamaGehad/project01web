<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links and Images</title>
</head>
<body>
    <h1>Developer Profile</h1>
    
    <!-- Profile picture via relative path with descriptive alt -->
    <img src="assets/profile.jpg" alt="Profile picture of the developer working on code">

    <p>Connect with me on external platforms or reach out directly below.</p>

    <!-- External Link with security attributes -->
    <p>
        Check out my GitHub Profile: 
        <a href="https://github.com/RamaGehad" target="_blank" rel="noopener noreferrer">GitHub Profile</a>
    </p>

    <!-- Navigation links (Anchor Jump & Mailto) -->
    <p>
        <a href="#contact">Jump to Contact Section</a>
    </p>

    <hr>

    <!-- Target section for internal anchor jump -->
    <h2 id="contact">Contact Information</h2>
    <p>
        Send me an email: 
        <a href="mailto:student@42.fr">student@42.fr</a>
    </p>
</body>
</html>
